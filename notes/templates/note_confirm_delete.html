{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css'>
    <link rel='stylesheet' href='{% static "css/styles.css" %}'>
    <title>Delete Note</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'notes_main' %}">Notelly </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link">Welcome to the delete note page</a>
                    </li>
                </ul> 
            </div>
        </div>
    </nav>

<div class="container mt-4">  
            <p class="item-title">Note: {{ note.title }}</p>
            <p>Description: {{ note.text }}</p>
        <form action="{% url 'note-delete' note.pk %}" method="post">
            {% csrf_token %}
            <p>Are you sure you want to delete "{{ note.title }}"?</p>
            <button type="submit" class="btn btn-danger">Yes, delete</button>
            <a href="{% url 'note-detail' note.pk %}" class="btn btn-secondary">Cancel</a>  
        </form>
</div>

</body>
</html>
