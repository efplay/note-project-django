{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css'>
    <link rel='stylesheet' href='{% static "css/styles.css" %}'>
    <title>{{ note.title }}</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'notes_main' %}">Notelly </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link">Welcome to the edit note page</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>{{ note.title }}</h2>
        <p>{{ note.text }}</p>
        {% if note.reminder %}
        <p class="text-muted">Reminder: {{ note.reminder|date:"d.m.Y H:i" }}</p>
        {% endif %}
        <p class="text-muted"><small>Created: {{ note.created_at|date:"d.m.Y H:i" }}</small></p>

        <div class="mt-3">
            <a href="{% url 'note-update' note.pk %}" class="btn btn-warning">Edit</a>
            <a href="{% url 'note-delete' note.pk %}" class="btn btn-danger">Delete</a>
            <a href="{% url 'view_notes' %}" class="btn btn-secondary">Back to list</a>
        </div>
    </div>

    <footer class='bg-dark text-white text-center mt-5 p-3'>
        <p class='mb-0'>&copy; Copyright 2026</p>
    </footer>
</body>
</html>

    
</body>
</html>
